<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="refresh" content="0; url=/PagetualGuide/first-run.html">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redirecting...</title>
    <script>
      (function () {
        var langList = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || '']).map(function (l) {
          return (l || '').toLowerCase();
        });
        var mappings = [
          { match: ['zh-cn', 'zh-hans', 'zh-sg'], path: '/PagetualGuide/cn/first-run.html' },
          { match: ['zh-tw', 'zh-hant', 'zh-hk', 'zh-mo'], path: '/PagetualGuide/tw/first-run.html' },
          { match: ['ja', 'ja-jp'], path: '/PagetualGuide/ja/first-run.html' },
          { match: ['de', 'de-de', 'de-at', 'de-ch'], path: '/PagetualGuide/de/first-run.html' },
          { match: ['es', 'es-es', 'es-419', 'es-mx'], path: '/PagetualGuide/es/first-run.html' },
          { match: ['fr', 'fr-fr', 'fr-ca'], path: '/PagetualGuide/fr/first-run.html' },
          { match: ['pt', 'pt-br', 'pt-pt'], path: '/PagetualGuide/pt/first-run.html' },
          { match: ['ru', 'ru-ru'], path: '/PagetualGuide/ru/first-run.html' },
          { match: ['ko', 'ko-kr'], path: '/PagetualGuide/ko/first-run.html' },
          { match: ['vi', 'vi-vn'], path: '/PagetualGuide/vi/first-run.html' }
        ];
        var target = '/PagetualGuide/first-run.html';
        for (var i = 0; i < langList.length; i++) {
          var lang = langList[i];
          if (!lang) continue;
          for (var j = 0; j < mappings.length; j++) {
            var rule = mappings[j];
            for (var k = 0; k < rule.match.length; k++) {
              if (lang === rule.match[k] || lang.indexOf(rule.match[k] + '-') === 0) {
                target = rule.path;
                i = langList.length; // break outer loop
                break;
              }
            }
            if (target !== '/PagetualGuide/first-run.html') break;
          }
        }
        var suffix = window.location.search + window.location.hash;
        window.location.replace(target + suffix);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to the localized first-run page...</p>
    <p><a href="/PagetualGuide/first-run.html">Continue</a></p>
  </body>
</html>
